name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opportunity_radar
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54329/opportunity_radar
      USE_IN_MEMORY_STORE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - name: Apply migrations
        run: |
          for f in ../docker/init/00_auth_stub.sql ../supabase/migrations/*.sql; do
            echo "applying $f";
            PGPASSWORD=postgres psql -h 127.0.0.1 -p 54329 -U postgres -d opportunity_radar -v ON_ERROR_STOP=1 -f "$f";
          done
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
