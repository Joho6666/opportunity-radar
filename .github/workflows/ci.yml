name: CI
on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opportunity_radar
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54329/opportunity_radar
      USE_IN_MEMORY_STORE: "false"
      PAID_API_ENABLED: "false"
      REDIS_URL: ""
      TEST_REDIS_URL: redis://127.0.0.1:6379
      REQUIRE_POSTGRES_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Apply migrations twice (second run must be a no-op)
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54329 -U postgres -d opportunity_radar -v ON_ERROR_STOP=1 -f ../docker/init/00_auth_stub.sql
          python -m app.database.migrate
          python -m app.database.migrate
      - run: python -m pytest -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp backend/.env.example backend/.env
      - name: Compose health, migrations and durable data restart
        run: ./scripts/compose-smoke.sh
      - name: Diagnostics
        if: failure()
        run: docker compose -p opportunity-radar-smoke logs --tail=100
      - name: Stop isolated CI services (keep named volumes)
        if: always()
        run: docker compose -p opportunity-radar-smoke down
