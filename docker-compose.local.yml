services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: opportunity_radar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?local.env must define LOCAL_DB_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30"]
    ports:
      - "127.0.0.1:${LOCAL_PG_PORT:-54330}:5432"
    volumes:
      - local_pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opportunity_radar"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${LOCAL_REDIS_PORT:-6380}:6379"
    volumes:
      - local_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  local_pgdata:
  local_redisdata:
