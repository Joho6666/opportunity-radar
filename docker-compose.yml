services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opportunity_radar
    ports: ["127.0.0.1:${PG_PORT:-54329}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opportunity_radar"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/opportunity_radar
      MIGRATIONS_DIR: /migrations
    volumes: ["./supabase/migrations:/migrations:ro"]
    command: python -m app.database.migrate
    restart: "no"
  backend:
    build: ./backend
    ports: ["127.0.0.1:${API_PORT:-8011}:8011"]
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/opportunity_radar
      USE_IN_MEMORY_STORE: "false"
      INCLUDE_MOCK_COLLECTOR: "false"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/opportunity_radar
      USE_IN_MEMORY_STORE: "false"
      INCLUDE_MOCK_COLLECTOR: "false"
    command: arq app.workers.settings.WorkerSettings
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  scheduler:
    build: ./backend
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/opportunity_radar
      USE_IN_MEMORY_STORE: "false"
      INCLUDE_MOCK_COLLECTOR: "false"
    command: python -m app.workers.scheduler
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
volumes:
  pgdata:
  redisdata:
