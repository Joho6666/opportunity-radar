services:
  backend:
    build: ./backend
    ports: ["8011:8011"]
    env_file: ./backend/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    profiles: ["workers"]
